name: Refresh Polymarket signals

on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Call /polymarket/refresh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MATCHMIND_API_URL: ${{ secrets.MATCHMIND_API_URL }}
      MATCHMIND_INTERNAL_API_TOKEN: ${{ secrets.MATCHMIND_INTERNAL_API_TOKEN }}
      REFRESH_ENDPOINT: /polymarket/refresh
    steps:
      - name: Refresh cached Polymarket markets
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${MATCHMIND_API_URL}" ]]; then
            echo "MATCHMIND_API_URL secret is not configured."
            exit 1
          fi

          if [[ -z "${MATCHMIND_INTERNAL_API_TOKEN}" ]]; then
            echo "MATCHMIND_INTERNAL_API_TOKEN secret is not configured."
            exit 1
          fi

          api_url="${MATCHMIND_API_URL%/}"
          url="${api_url}${REFRESH_ENDPOINT}"
          body_file="$(mktemp)"
          status="000"

          for attempt in 1 2 3; do
            echo "Calling endpoint: ${REFRESH_ENDPOINT} (attempt ${attempt}/3)"
            status="$(
              curl --silent --show-error \
                --request POST \
                --header "X-Internal-Token: ${MATCHMIND_INTERNAL_API_TOKEN}" \
                --output "${body_file}" \
                --write-out "%{http_code}" \
                "${url}"
            )"

            if [[ "${status}" -ge 200 && "${status}" -lt 300 ]]; then
              break
            fi

            if [[ "${status}" != "502" && "${status}" != "503" && "${status}" != "504" ]]; then
              break
            fi

            if [[ "${attempt}" -lt 3 ]]; then
              echo "Transient server status ${status}; waiting before retry."
              sleep 30
            fi
          done

          echo "HTTP status: ${status}"
          echo "Response body preview:"
          head -c 1000 "${body_file}"
          echo

          if [[ "${status}" -lt 200 || "${status}" -ge 300 ]]; then
            echo "Refresh failed for ${REFRESH_ENDPOINT}."
            exit 1
          fi
