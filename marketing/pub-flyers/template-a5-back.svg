<svg xmlns="http://www.w3.org/2000/svg" width="154mm" height="216mm" viewBox="0 0 154 216">
  <title>{{BACK_HEADLINE_1}} {{BACK_HEADLINE_2}}</title>
  <desc>Matchmind A5 flyer back with 3 mm bleed. Trim size: 148 x 210 mm.</desc>
  <metadata><matchmind-flyer side="back" language="{{LANGUAGE}}" destination-url="{{URL}}" trim-size-mm="148x210" bleed-mm="3"/></metadata>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2035"/>
      <stop offset="48%" stop-color="#05101E"/>
      <stop offset="100%" stop-color="#02060D"/>
    </linearGradient>
    <pattern id="grid" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M7 0H0V7" fill="none" stroke="#1A3B57" stroke-width="0.25"/>
    </pattern>
    <clipPath id="trim"><rect x="3" y="3" width="148" height="210"/></clipPath>
  </defs>
  <rect width="154" height="216" fill="url(#backdrop)"/>
  <rect width="154" height="216" fill="url(#grid)" opacity="0.85"/>
  <g clip-path="url(#trim)">
    <path d="M-12 200C43 156 88 154 170 98" fill="none" stroke="#00FF87" stroke-width="1.2" opacity="0.4"/>
    <path d="M-12 207C44 162 95 160 173 105" fill="none" stroke="#FFD600" stroke-width="0.45" opacity="0.62"/>
    <g transform="translate(11 11)">
      <text x="0" y="0" fill="#00FF87" font-family="Arial, Helvetica, sans-serif" font-size="2.65" font-weight="700" letter-spacing="0.45">{{BACK_KICKER}}</text>
      <text x="0" y="18" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13.2" font-weight="700" letter-spacing="-0.65">{{BACK_HEADLINE_1}}</text>
      <text x="0" y="32" fill="#FFD600" font-family="Arial, Helvetica, sans-serif" font-size="{{BACK_HEADLINE_2_SIZE}}" font-weight="700" letter-spacing="-0.65">{{BACK_HEADLINE_2}}</text>
      <text x="0" y="43" fill="#C2D1E6" font-family="Arial, Helvetica, sans-serif" font-size="3.8">{{BACK_INTRO_1}}</text>
      <text x="0" y="49" fill="#C2D1E6" font-family="Arial, Helvetica, sans-serif" font-size="3.8">{{BACK_INTRO_2}}</text>
    </g>
    <g transform="translate(11 69)">
      <rect width="132" height="61" rx="6" fill="#0A1A2E" stroke="#2B587C" stroke-width="0.7"/>
      <rect x="0" y="0" width="132" height="12" rx="6" fill="#12304C"/>
      <circle cx="8" cy="6" r="2.15" fill="#00FF87"/>
      <text x="13" y="7.2" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="3.1" font-weight="700">MATCHMIND AI · COACH VERDICT</text>
      <text x="8" y="22" fill="#AFC0DA" font-family="Arial, Helvetica, sans-serif" font-size="3.3">{{QUESTION}}</text>
      <text x="8" y="34" fill="#FFD600" font-family="Arial, Helvetica, sans-serif" font-size="4.5" font-weight="700">{{VERDICT}}</text>
      <text x="8" y="43" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="3.3">{{ANSWER_1}}</text>
      <text x="8" y="49" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="3.3">{{ANSWER_2}}</text>
      <rect x="8" y="53" width="36" height="5.6" rx="2.8" fill="#00FF87"/>
      <text x="26" y="56.9" fill="#04101D" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="2.5" font-weight="700">{{CONFIDENCE}}</text>
    </g>
    <g transform="translate(11 141)">
      <text x="0" y="0" fill="#00FF87" font-family="Arial, Helvetica, sans-serif" font-size="2.65" font-weight="700" letter-spacing="0.55">{{PROOF_KICKER}}</text>
      <g transform="translate(0 9)">
        <text x="0" y="0" fill="#FFD600" font-family="Arial, Helvetica, sans-serif" font-size="5" font-weight="700">{{PROOF_1_NUMBER}}</text>
        <text x="11" y="0" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="3.8" font-weight="700">{{PROOF_1_TITLE}}</text>
        <text x="11" y="5.7" fill="#9EB5D4" font-family="Arial, Helvetica, sans-serif" font-size="2.75">{{PROOF_1_BODY}}</text>
        <text x="0" y="16" fill="#FFD600" font-family="Arial, Helvetica, sans-serif" font-size="5" font-weight="700">{{PROOF_2_NUMBER}}</text>
        <text x="11" y="16" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="3.8" font-weight="700">{{PROOF_2_TITLE}}</text>
        <text x="11" y="21.7" fill="#9EB5D4" font-family="Arial, Helvetica, sans-serif" font-size="2.75">{{PROOF_2_BODY}}</text>
        <text x="0" y="32" fill="#FFD600" font-family="Arial, Helvetica, sans-serif" font-size="5" font-weight="700">{{PROOF_3_NUMBER}}</text>
        <text x="11" y="32" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="3.8" font-weight="700">{{PROOF_3_TITLE}}</text>
        <text x="11" y="37.7" fill="#9EB5D4" font-family="Arial, Helvetica, sans-serif" font-size="2.75">{{PROOF_3_BODY}}</text>
      </g>
      <g transform="translate(91 -1)">
        <rect width="39" height="39" rx="2.5" fill="#FFFFFF"/>
        <g transform="scale(0.8125)">{{QR_MODULES}}</g>
        <text x="19.5" y="45" fill="#00FF87" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="2.55" font-weight="700">{{BACK_CTA}}</text>
        <text x="19.5" y="50" fill="#AFC0DA" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="2.4">{{FALLBACK_URL}}</text>
      </g>
    </g>
    <text x="11" y="207" fill="#92A8C6" font-family="Arial, Helvetica, sans-serif" font-size="2.6">{{FOOTER}}</text>
  </g>
</svg>
