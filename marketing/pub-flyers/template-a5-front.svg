<svg xmlns="http://www.w3.org/2000/svg" width="154mm" height="216mm" viewBox="0 0 154 216">
  <title>{{FRONT_TITLE}}</title>
  <desc>Matchmind A5 flyer front with 3 mm bleed. Trim size: 148 x 210 mm.</desc>
  <metadata><matchmind-flyer side="front" language="{{LANGUAGE}}" destination-url="{{URL}}" trim-size-mm="148x210" bleed-mm="3"/></metadata>
  <defs>
    <radialGradient id="spotlight" cx="50%" cy="22%" r="82%">
      <stop offset="0%" stop-color="#163A55"/>
      <stop offset="42%" stop-color="#071526"/>
      <stop offset="100%" stop-color="#030810"/>
    </radialGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00FF87"/>
      <stop offset="100%" stop-color="#00C8FF"/>
    </linearGradient>
    <pattern id="halftone" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.55" fill="#5E7898" opacity="0.32"/>
    </pattern>
    <clipPath id="trim"><rect x="3" y="3" width="148" height="210"/></clipPath>
  </defs>
  <rect width="154" height="216" fill="url(#spotlight)"/>
  <g clip-path="url(#trim)">
    <circle cx="128" cy="50" r="58" fill="url(#halftone)" opacity="0.7"/>
    <circle cx="78" cy="230" r="90" fill="none" stroke="#00FF87" stroke-width="0.65" opacity="0.55"/>
    <circle cx="78" cy="230" r="72" fill="none" stroke="#00C8FF" stroke-width="0.3" opacity="0.55"/>
    <path d="M-15 176 L164 72" stroke="#00FF87" stroke-width="2.3" opacity="0.2"/>
    <path d="M-10 190 L166 88" stroke="#FFD600" stroke-width="0.85" opacity="0.65"/>
    <path d="M-20 58 H176 M-20 125 H176" stroke="#6F95BC" stroke-width="0.25" opacity="0.3"/>
    <g transform="translate(11 10)">
      <rect width="13" height="13" rx="3" fill="#0B1A2D" stroke="#00FF87" stroke-width="0.5"/>
      <path d="M2.8 8.7V4.3H4.6L6.5 6.7L8.4 4.3H10.2V8.7H8.7V6.5L7.15 8.4H5.85L4.3 6.5V8.7Z" fill="#FFFFFF"/>
      <path d="M3.2 10.2H9.1" stroke="#00FF87" stroke-width="0.85" stroke-linecap="round"/>
      <circle cx="10.1" cy="10.2" r="0.55" fill="#00FF87"/>
      <text x="17" y="5.8" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="5" font-weight="700">MATCHMIND</text>
      <text x="17" y="11.2" fill="#9EB5D4" font-family="Arial, Helvetica, sans-serif" font-size="2.25" font-weight="700" letter-spacing="0.5">WORLD CUP AI COACH</text>
    </g>
    <g transform="translate(11 37)">
      <rect width="103" height="7" rx="3.5" fill="#00FF87"/>
      <text x="4" y="4.9" fill="#04101D" font-family="Arial, Helvetica, sans-serif" font-size="2.75" font-weight="700" letter-spacing="0.38">{{KICKER}}</text>
      <text x="0" y="26" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="-0.9"> {{FRONT_HEADLINE_1}}</text>
      <text x="0" y="44" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="-0.9"> {{FRONT_HEADLINE_2}}</text>
      <text x="0" y="62" fill="#FFD600" font-family="Arial, Helvetica, sans-serif" font-size="{{FRONT_ACCENT_SIZE}}" font-weight="700" letter-spacing="-0.9">{{FRONT_ACCENT}}</text>
      <text x="0" y="75" fill="#D4E0F2" font-family="Arial, Helvetica, sans-serif" font-size="4.6" font-weight="700">{{FRONT_BODY_1}}</text>
      <text x="0" y="82" fill="#A9BAD4" font-family="Arial, Helvetica, sans-serif" font-size="3.8">{{FRONT_BODY_2}}</text>
    </g>
    <g transform="translate(11 132)">
      <rect width="132" height="66" rx="7" fill="#071628" stroke="#245276" stroke-width="0.65"/>
      <path d="M62 0V66" stroke="#245276" stroke-width="0.55"/>
      <text x="7" y="12" fill="#00FF87" font-family="Arial, Helvetica, sans-serif" font-size="3" font-weight="700" letter-spacing="0.55">{{SCAN_LINE}}</text>
      <text x="7" y="20" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="{{FRONT_CTA_SIZE}}" font-weight="700">{{FRONT_CTA}}</text>
      <rect x="7" y="28" width="47" height="9" rx="4.5" fill="#FFD600"/>
      <text x="30.5" y="34" fill="#04101D" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="2.8" font-weight="700">{{FREE_LINE}}</text>
      <text x="7" y="47" fill="#9EB5D4" font-family="Arial, Helvetica, sans-serif" font-size="2.9">{{SCAN_SUBLINE_1}}</text>
      <text x="7" y="53" fill="#9EB5D4" font-family="Arial, Helvetica, sans-serif" font-size="2.9">{{SCAN_SUBLINE_2}}</text>
      <g transform="translate(77 8)">
        <rect width="48" height="48" rx="2.8" fill="#FFFFFF"/>
        {{QR_MODULES}}
        <text x="24" y="56.5" fill="#00FF87" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="3.25" font-weight="700">{{FALLBACK_URL}}</text>
      </g>
    </g>
    <text x="11" y="207" fill="#92A8C6" font-family="Arial, Helvetica, sans-serif" font-size="2.6">{{FOOTER}}</text>
  </g>
</svg>
